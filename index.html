<style id="enjaz-lang-hero">
/* ===== Language toggle (AR / EN) ===== */
body[data-lang="ar"] .en-only { display: none !important; }
body[data-lang="en"] .ar-only { display: none !important; }
#langBtn {
  position: fixed; top: 16px; left: 16px; z-index: 2147483647;
  background: linear-gradient(135deg, #C8A951 0%, #E8D5B5 100%);
  border: 1.5px solid #FFFFFF; border-radius: 50px; padding: 12px 26px;
  font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 15px; line-height: 1.2;
  color: #FFFFFF; cursor: pointer; letter-spacing: .02em;
  box-shadow: 0 8px 32px rgba(200,169,81,0.45);
  display: inline-flex; align-items: center; gap: 8px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease;
}
#langBtn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(200,169,81,0.7); }
#langBtn:active { transform: scale(.97); }
#langBtn:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 3px; }
/* keep the sticky header clear of the button */
header > div { padding-left: 160px !important; }
@media (max-width: 768px) {
  #langBtn { top: 12px; left: 12px; padding: 9px 16px; font-size: 13px; }
  header > div { padding-left: 112px !important; }
}
/* LTR adjustments when English is active */
html[dir="ltr"] .text-right { text-align: left !important; }
html[dir="ltr"] .md\:text-right { text-align: left !important; }
html[dir="ltr"] .title-underline { right: auto; left: 0; transform-origin: left center; }
html[dir="ltr"] .service-number { right: auto; left: 14px; transform-origin: top left; }
html[dir="ltr"] .mr-6 { margin-right: 0; margin-left: 1.5rem; }
html[dir="ltr"] .bg-gradient-to-l { --tw-gradient-from-position: ; background-image: linear-gradient(to right, var(--tw-gradient-stops)) !important; }
html[dir="ltr"] body, html[dir="ltr"] #root > div { font-family: 'Cairo', 'Tajawal', sans-serif; }

/* ===== Interactive Saudi map hero ===== */
#hero.enjaz-map-hero {
  position: relative; min-height: 100vh; background: #0A192F !important;
  padding: 104px 24px 96px; display: flex; align-items: center; overflow: hidden !important;
  font-family: 'Cairo', sans-serif;
}
.mh-bg { position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(circle at 75% 45%, rgba(200,169,81,0.10), transparent 55%),
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px) 0 0 / 48px 48px,
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px) 0 0 / 48px 48px; }
.mh-orb { position: absolute; border-radius: 50%; filter: blur(110px); }
.mh-orb1 { width: 520px; height: 520px; background: rgba(200,169,81,0.16); right: -120px; top: 10%; }
.mh-orb2 { width: 380px; height: 380px; background: rgba(232,213,181,0.08); left: -120px; bottom: -80px; }
.mh-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; z-index: 1;
  background: linear-gradient(180deg, rgba(10,25,47,0) 0%, #0A192F 100%); }
.mh-grid { position: relative; z-index: 2; width: 100%; max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: 55fr 45fr; gap: 48px; align-items: center; direction: ltr; }
.mh-content { direction: rtl; text-align: right; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
html[dir="ltr"] .mh-content { direction: ltr; text-align: left; }
.mh-logo { width: 150px; height: auto; margin-bottom: 26px; filter: drop-shadow(0 0 18px rgba(200,169,81,0.45)); }
.mh-eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px;
  background: rgba(255,255,255,0.06); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(200,169,81,0.30); color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 700; }
.mh-live { position: relative; width: 9px; height: 9px; border-radius: 50%; background: #22C55E; flex-shrink: 0;
  box-shadow: 0 0 10px #22C55E; }
.mh-live::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid #22C55E;
  animation: mhPing 1.8s cubic-bezier(0,0,.2,1) infinite; }
@keyframes mhPing { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
.mh-title { margin: 22px 0 0; font-size: 56px !important; font-weight: 900 !important; line-height: 1.2; color: #FFFFFF !important;
  position: relative; padding-bottom: 18px; letter-spacing: -0.01em; }
.mh-underline { position: absolute; bottom: 0; right: 0; height: 4px; width: 46%; border-radius: 4px;

  transform-origin: right; animation: mhLine 1.2s .3s cubic-bezier(.16,1,.3,1) both; }
html[dir="ltr"] .mh-underline { right: auto; left: 0; transform-origin: left; }
@keyframes mhLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.mh-sub { margin: 22px 0 0; font-size: 21px; font-weight: 600; line-height: 1.7; color: rgba(255,255,255,0.82); max-width: 560px; }
.mh-badges { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.mh-badge { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 14px;
  background: rgba(255,255,255,0.06); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);

  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
.mh-badge i { font-style: normal; color: #C8A951; text-shadow: 0 0 10px rgba(200,169,81,0.8); }
.mh-ctas { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
.mh-btn { font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 800; padding: 14px 34px; border-radius: 999px;
  cursor: pointer; transition: all .4s cubic-bezier(.16,1,.3,1); }
.mh-btn-primary { background: linear-gradient(135deg, #C8A951, #E8D5B5); color: #0A192F; border: 0;
  box-shadow: 0 0 24px rgba(200,169,81,0.45), 0 8px 24px rgba(200,169,81,0.3); }
.mh-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(200,169,81,0.8), 0 12px 30px rgba(200,169,81,0.4); }
.mh-btn-ghost { background: rgba(255,255,255,0.06); color: #FFFFFF; border: 1.5px solid rgba(200,169,81,0.45);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
.mh-btn-ghost:hover { background: rgba(200,169,81,0.12); border-color: #E8D5B5; transform: translateY(-2px); }

.mh-visual { position: relative; min-width: 0; }
.mh-panel { position: relative; border-radius: 32px; padding: 22px 22px 20px;
  background: rgba(255,255,255,0.06); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(200,169,81,0.24);
  box-shadow: 0 24px 64px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08), 0 0 40px rgba(200,169,81,0.10); }
.mh-counter { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 auto 10px; width: fit-content;
  padding: 8px 18px; border-radius: 999px; background: rgba(10,25,47,0.6); border: 1px solid rgba(34,197,94,0.35);

<script id="enjaz-vector-script">
document.addEventListener('DOMContentLoaded', () => {
    // تحويل عناصر SVG لتتضمن النقطة الأصلية والفيكتور معاً للتبديل بينهما
    const convertDotsToCandidates = () => {
        document.querySelectorAll('circle.mh-mote').forEach(circle => {
            // تجاهل العناصر التي تم تعديلها مسبقاً
            if (circle.parentNode.classList.contains('mh-mote-wrapper')) return;
            
            const ns = "http://www.w3.org/2000/svg";
            
            // إنشاء مجموعة لاحتواء الحركة والشكلين
            const g = document.createElementNS(ns, "g");
            g.setAttribute("class", "mh-mote-wrapper mh-mote");
            g.setAttribute("style", circle.getAttribute("style")); // أخذ اللون الأصلي
            
            // نقل أنميشن الحركة من الدائرة إلى المجموعة
            while (circle.firstChild) {
                g.appendChild(circle.firstChild);
            }
            
            // الدائرة الأصلية للخريطة العلوية
            const newCircle = document.createElementNS(ns, "circle");
            newCircle.setAttribute("r", circle.getAttribute("r") || "2.6");
            newCircle.setAttribute("class", "mh-mote-circle");
            
            // الفيكتور الجديد للخريطة في الخلفية
            const newPath = document.createElementNS(ns, "path");
            newPath.setAttribute("class", "mh-mote-vector");
            // مسار الأيقونة (رأس وجسم)
            newPath.setAttribute("d", "M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z");
            newPath.setAttribute("transform", "scale(0.4) translate(-12, -12)");
            
            g.appendChild(newCircle);
            g.appendChild(newPath);
            
            circle.parentNode.replaceChild(g, circle);
        });
    };

    setTimeout(convertDotsToCandidates, 300);

    const observer = new MutationObserver(convertDotsToCandidates);
    const rootEl = document.getElementById('root');
    if (rootEl) {
        observer.observe(rootEl, { childList: true, subtree: true });
    }
});
</script>

.ea-b{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-end-start-radius:4px}
.ea-u{align-self:flex-end;background:linear-gradient(135deg,#C8A951,#E8D5B5);color:#0A192F;font-weight:700;border-end-end-radius:4px}
.ea-sum{display:grid;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.2)}
.ea-sum div{display:flex;gap:8px;justify-content:space-between;font-size:13px}
.ea-sum span.k{color:rgba(255,255,255,.6)}.ea-sum span.v{font-weight:800;color:#E8D5B5;text-align:end}
#ea-ctl{padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,.08);background:#0A192F;display:flex;flex-direction:column;gap:8px}
.ea-opt{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:14px;cursor:pointer;text-align:start;font:700 14px 'Cairo','Tajawal',sans-serif;
  color:#fff;background:rgba(255,255,255,.06);border:1.5px solid rgba(200,169,81,.4);transition:all .25s}
.ea-opt:hover{background:rgba(200,169,81,.2);border-color:#E8D5B5;transform:translateY(-1px)}
.ea-opt i{font-style:normal;font-size:18px}
.ea-row{display:flex;gap:8px}
.ea-in{flex:1;min-width:0;box-sizing:border-box;padding:12px 14px;border-radius:14px;color:#fff;background:rgba(16,34,64,0.65);border:1.5px solid rgba(200,169,81,.4);font:600 15px 'Cairo','Tajawal',sans-serif;outline:none}
.ea-in:focus{border-color:#E8D5B5;box-shadow:0 0 0 3px rgba(200,169,81,.22)}
.ea-in.ea-err{border-color:#F87171;box-shadow:0 0 0 3px rgba(248,113,113,.2)}
.ea-go{padding:0 18px;border:0;border-radius:14px;cursor:pointer;font:800 14px 'Cairo','Tajawal',sans-serif;color:#0A192F;background:linear-gradient(135deg,#C8A951,#E8D5B5)}
.ea-act{display:block;text-align:center;text-decoration:none;padding:12px 14px;border-radius:999px;cursor:pointer;font:800 14px 'Cairo','Tajawal',sans-serif;color:#0A192F;background:linear-gradient(135deg,#C8A951,#E8D5B5);border:0}
.ea-act.ea-ghost{color:#fff;background:rgba(255,255,255,.08);border:1.5px solid rgba(200,169,81,.45)}
.ea-step{font-size:12px;color:rgba(255,255,255,.55)}
@media (max-width:480px){#ea-panel{right:12px;left:12px;width:auto;max-width:none;bottom:calc(90px + env(safe-area-inset-bottom,0px));height:min(560px,calc(100vh - 110px))}
  #ea-fab{right:14px;width:58px;height:58px}}
@media (prefers-reduced-motion:reduce){#ea-fab{animation:none}}
/* ===== layout & polish v20: lighter frames, grids, tighter rhythm (no content changes) ===== */
@media (min-width:768px){#root section[id]:not(#hero){padding-top:68px !important;padding-bottom:68px !important}}
@media (max-width:767px){#root section[id]:not(#hero){padding-top:44px !important;padding-bottom:44px !important}}

/* lighter, cleaner frames */
#root main .glass{border:1px solid rgba(200,169,81,.22) !important;background-color:rgba(16,34,64,0.65) !important;
  box-shadow:0 6px 24px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06) !important;
  backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
  transition:border-color .3s ease,box-shadow .3s ease,transform .4s cubic-bezier(.16,1,.3,1)}
#root main .glass:hover{border-color:rgba(232,213,181,.5) !important;
  box-shadow:0 12px 34px rgba(0,0,0,.38),0 0 26px rgba(200,169,81,.16),inset 0 1px 0 rgba(255,255,255,.08) !important}

/* ---- why Enjaz: 3-column comparison cards, Enjaz row highlighted ---- */
#why div:has(> .compare-card-pro){display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px !important}
#why .compare-card-pro{padding:22px !important;min-height:0 !important;gap:14px !important;border-radius:20px !important;
  backdrop-filter:none !important;-webkit-backdrop-filter:none !important;background:rgba(16,34,64,0.65) !important;
  border:1px solid rgba(200,169,81,.22) !important;box-shadow:0 6px 24px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06) !important;
  transition:border-color .3s ease,box-shadow .3s ease}
#why .compare-card-pro:hover{border-color:rgba(232,213,181,.5) !important;box-shadow:0 12px 34px rgba(0,0,0,.38),0 0 26px rgba(200,169,81,.16) !important}
#why .compare-card-pro>div:nth-child(2){gap:10px !important;margin-top:0 !important}
#why .compare-card-pro>div:nth-child(2)>div:first-child{background:rgba(200,169,81,.12);border:1px solid rgba(200,169,81,.30);border-radius:14px;padding:12px 14px}
#why .compare-card-pro>div:nth-child(2)>div:last-child{padding:4px 14px}
#why .compare-card-pro>div:nth-child(2)>div:nth-child(2){display:none}

/* ---- about ---- */
#about .glass{padding:28px !important;min-height:0 !important;border-radius:20px !important}
#about .grid:has(> .feature-card-pro){grid-template-columns:repeat(4,minmax(0,1fr)) !important;gap:16px !important}
#about .feature-card-pro{padding:22px !important;min-height:0 !important;border-radius:18px !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
  background:rgba(16,34,64,0.65) !important;border:1px solid rgba(200,169,81,.22) !important;box-shadow:0 6px 24px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06) !important;
  transition:border-color .3s ease,box-shadow .3s ease}
#about .feature-card-pro:hover{border-color:rgba(232,213,181,.5) !important;box-shadow:0 12px 34px rgba(0,0,0,.38),0 0 26px rgba(200,169,81,.16) !important}

/* ---- strategy / experience ---- */
#strategy .glass{min-height:0 !important;padding:24px !important;border-radius:20px !important}
#experience .glass{min-height:0 !important;padding:32px !important;border-radius:20px !important}

/* ---- sectors: 2x2 ---- */
#sectors div:has(> .sector-card){display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px !important}
#sectors .sector-card{padding:26px !important;border-radius:20px !important}

/* ---- method: 5 steps in one row + wide reports bar ---- */
#method div.gap-5.relative:not(.glass){display:grid !important;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px !important}
#method div.gap-5.relative:not(.glass)>.glass{flex-direction:column !important;align-items:flex-start !important;gap:14px !important;padding:20px !important;border-radius:20px !important}
#method div.gap-5.relative:not(.glass)>.glass:last-child{grid-column:1/-1;flex-direction:row !important;align-items:center !important;padding:18px 24px !important}

/* ---- faq / compliance: a bit lighter ---- */
#faq .glass{border-radius:16px !important}
#compliance .glass{border-radius:16px !important}

/* ---- tablet ---- */
@media (max-width:1099px){
  #why div:has(> .compare-card-pro){grid-template-columns:repeat(2,minmax(0,1fr))}
  #about .grid:has(> .feature-card-pro){grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  #method div.gap-5.relative:not(.glass){grid-template-columns:repeat(2,minmax(0,1fr))}
  #method div.gap-5.relative:not(.glass)>.glass:nth-child(5){grid-column:1/-1}
}
/* ---- phone ---- */
@media (max-width:699px){
  #why div:has(> .compare-card-pro),#sectors div:has(> .sector-card),
  #about .grid:has(> .feature-card-pro),#method div.gap-5.relative:not(.glass){grid-template-columns:minmax(0,1fr) !important}
  #sectors .sector-card{padding:20px !important}
  #method div.gap-5.relative:not(.glass)>.glass{flex-direction:row !important;align-items:center !important;padding:16px !important}
  #method div.gap-5.relative:not(.glass)>.glass:nth-child(5){grid-column:auto}
  #experience .glass{padding:22px !important}
}

<body data-lang="ar">
  <div id="root"></div>
  
  <script id="enjaz-lang-toggle">
(function () {
  var TITLES = {
    ar: "شركة إنجاز الموارد البشرية | شريككم الاستراتيجي - الملف التعريفي 2026",
    en: "Enjaz Human Resources | Your Strategic Partner - Company Profile 2026"
  };
  var DESC = {
    ar: "شركة إنجاز الموارد البشرية - شريككم الاستراتيجي في الاستقطاب والتوظيف وتأجير العمالة والهيكلة والتطوير التنظيمي بالرياض. خبرة 20 عام، امتثال قوى ومدد، نطاقات. الملف التعريفي 2026",
    en: "Enjaz Human Resources - your strategic partner in recruitment, hiring, manpower outsourcing, organizational structuring and development in Riyadh. 20 years of experience, Qiwa and Mudad compliance, Nitaqat. Company Profile 2026"
  };
  var btn = document.createElement("button");
  btn.id = "langBtn";
  btn.type = "button";
  document.body.appendChild(btn);

  function apply(lang) {
    var html = document.documentElement;
    document.body.setAttribute("data-lang", lang);
    html.setAttribute("lang", lang);
    html.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    btn.innerHTML = lang === "ar" ? "EN 🇺🇸" : "AR 🇸🇦";
    btn.setAttribute("aria-label", lang === "ar" ? "Switch to English" : "التبديل إلى العربية");
    document.title = TITLES[lang];
    var m = document.querySelector('meta[name="description"]');
    if (!m) { m = document.createElement("meta"); m.setAttribute("name", "description"); document.head.appendChild(m); }
    m.setAttribute("content", DESC[lang]);
    try { localStorage.setItem("enjaz-lang", lang); } catch (e) {}
  }

  var start = "ar";
  try { if (localStorage.getItem("enjaz-lang") === "en") start = "en"; } catch (e) {}
  apply(start);

  btn.addEventListener("click", function () {
    apply(document.body.getAttribute("data-lang") === "ar" ? "en" : "ar");
  });

  // Hero buttons (rendered as static markup inside React)
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("[data-goto]");
    if (!t) return;
    var el = document.getElementById(t.getAttribute("data-goto"));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  // Live candidate counter
  var n = 3847;
  setInterval(function () {
    var el = document.getElementById("mhCount");
    if (!el) return;
    n += Math.floor(Math.random() * 7) - 3;
    if (n < 3820) n = 3824;
    if (n > 3880) n = 3876;
    el.textContent = String(n);
  }, 2200);
})();
</script>

var FAQ_EN = [["What is the difference between direct recruitment and executive search?", "Direct recruitment targets operational and mid-level roles through broad channels and fast screening, while executive search (headhunting) is dedicated to leadership and critical positions. It relies on direct, confidential targeting of rare talent and a deep assessment of cultural and leadership fit."], ["How do you ensure Saudization rates under Nitaqat?", "We start by analyzing your Nitaqat gap and classifying the roles that can be Saudized, then recruit verified Saudi talent through Taqat and Jadarah and link them directly to the Qiwa platform, with a monthly report on your Saudization rate and its impact on the green band."], ["How long does it take to provide a qualified candidate?", "5-7 business days for operational roles, 10-14 days for specialized roles, and 20-30 days for leadership positions through executive search. We commit to a shortlist of 3 matching candidates for every vacancy."], ["Do you handle Iqama and insurance procedures for outsourced manpower?", "Yes, fully. In the manpower outsourcing (EOS) model we handle issuing and renewing Iqamas, medical insurance, social insurance (GOSI), wage protection through Mudad, and leave and replacement management, all in one fixed monthly invoice."], ["What is your replacement policy during the probation period?", "We offer a free replacement guarantee during the first 90 days in case of poor fit or attrition, providing a replacement within 7 business days at no extra cost, with daily performance follow-up by a field supervisor."], ["How are manpower outsourcing services priced?", "Pricing is an all-inclusive monthly rate based on profession, experience and work location, covering salary, Iqama, insurance, supervision and transport if needed. There are no hidden costs, and your fixed costs become a flexible, measurable operating expense."], ["Do you offer organizational structuring and job description services?", "Yes, as part of our consulting and development track. We analyze your current structure, design the target structure, and prepare job description cards, salary scales and KPIs in line with Saudi Labor Law and Vision 2030."], ["Which sectors do you cover?", "We cover 4 main sectors: industrial and manufacturing, technical and engineering, services, operations and maintenance, and projects and logistics. Our database is classified by skill and professional certification."], ["How do you ensure compliance with Labor Law and the Qiwa and Mudad platforms?", "All our contracts are digital through Qiwa, our payroll is documented through Mudad, and our procedures comply with Articles 8 and 61 of the Labor Law. Our compliance team holds Ministry of Human Resources license No. 7029889255 and legally reviews every hiring process."], ["Do you provide staff on flexible monthly contracts?", "Yes, our contracts are flexible from one to 12 months and renewable. They suit seasonal projects, peak periods and leave cover, with the option to convert to a permanent contract with no extra fees after 6 months."], ["How do you follow up after hiring?", "We assign an account manager to every client, with a monthly performance report, a site visit every 15 days, 30-60-90 day satisfaction surveys, and an emergency hotline. Our goal is to keep annual turnover below 8%."], ["Do you offer workplace development consulting?", "Yes. We offer workplace diagnostics, employee retention programs, employee experience (EX) improvement, performance culture building, and sustainable Saudization programs, with on-site workshops at client premises in Riyadh, Jeddah and the Eastern Province."], ["How is client and candidate data protected?", "We comply with the Personal Data Protection Law (PDPL), use AES-256 database encryption and role-based access, and never share any data without written consent. All our servers are located inside the Kingdom."], ["How do your contracts differ from traditional contracts?", "A traditional contract is a fixed cost with full administrative responsibility on you, while an Enjaz contract turns the cost into a variable one and shifts the burden of Iqamas, insurance and replacements to us, with a single invoice and the flexibility to pause or scale manpower within 48 hours."], ["How do I start working with Enjaz?", "In three steps: 1) a free 30-minute diagnostic session to understand your needs and Nitaqat band, 2) a technical and financial proposal within 24 hours, 3) digital signing via Qiwa and supply begins within 5 days. Reach us at info@enjazhcm.com or on WhatsApp."]];

<script id="enjaz-scroll-logic">
document.addEventListener('DOMContentLoaded', () => {
    let ticking = false;
    window.addEventListener('scroll', () => {
        if (!ticking) {
            window.requestAnimationFrame(() => {
                if (false) {
                    document.body.classList.add('bg-map-active');
                } else {
                    document.body.classList.remove('bg-map-active');
                }
                ticking = false;
            });
            ticking = true;
        }
    }, { passive: true });

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
            }
        });
    }, { threshold: 0.1 });

    const reactRootObserver = new MutationObserver(() => {
        const sections = document.querySelectorAll('#root section:not(#hero)');
        sections.forEach((sec, index) => {
            if (!sec.dataset.animated) {
                sec.dataset.animated = 'true';
                sec.classList.add('scroll-animate');
                if (index % 2 === 0) {
                    sec.classList.add('from-right');
                } else {
                    sec.classList.add('from-left');
                }
                observer.observe(sec);
            }
        });
    });

    const rootEl = document.getElementById('root');
    if (rootEl) {
        reactRootObserver.observe(rootEl, { childList: true, subtree: true });
    }
});
</script>
